name: Publish tested development builds to PyPI

on:
  workflow_run:
    workflows: [tests]
    branches: [master]
    types: [completed]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Publish only a master push of this repository whose ``tests`` run
    # succeeded: not a pull request, and not a fork's branch named ``master``.
    # Skip the per-commit ``.devN`` publish when the head commit is the stable
    # release commit produced by ``.github/workflows/monthly-release.yml``.
    # At that commit, ``braindecode/version.py`` is ``X.Y.Z`` (no ``.dev``),
    # and running this job would otherwise push ``X.Y.Z.devN`` to PyPI right
    # after the stable ``X.Y.Z``. The companion ``chore: bump version`` commit
    # is intentionally NOT excluded — it kicks off the next dev cycle.
    if: >-
      github.repository == 'braindecode/braindecode' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'release: v')
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      PYPI_USERNAME: __token__

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0  # the commit count below needs the full history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build packaging

      # N counts master's commits up to the tested one, so ``pip install --pre``
      # resolves to the newest build (a hash-derived N ordered the builds at random).
      - name: Set the development version
        run: python scripts/monthly_release.py dev-build "$(git rev-list --first-parent --count HEAD)"

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true  # a re-run of ``tests`` repeats its commit's version
