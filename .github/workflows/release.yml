name: Publish tested development builds to PyPI

on:
  workflow_run:
    workflows: [tests]
    branches: [master]
    types: [completed]

jobs:
  publish:
    if: >-
      github.repository == 'braindecode/braindecode' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set the development version
        run: |
          python -m pip install packaging
          python scripts/monthly_release.py dev-build
      - uses: ./.github/actions/check-wheel
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
