name: docs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pull requests skip docs builds when no docs/examples/public docstrings changed,
# build no-plot HTML when only RST/docstrings changed, and execute only modified
# gallery scripts otherwise. Master pushes reuse cached Sphinx-Gallery outputs
# with module-aware invalidation; weekly schedule and release tags run cold.
on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  pull_request:
    branches:
      - '*' # all branches, including forks
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      run_examples: ${{ steps.check.outputs.run_examples }}
      gallery_arg: ${{ steps.check.outputs.gallery_arg }}
      extras: ${{ steps.check.outputs.extras }}
      use_gallery_cache: ${{ steps.check.outputs.use_gallery_cache }}
    steps:
      - name: Checking Out Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Plan Documentation Build
        id: check
        run: python .github/scripts/plan_docs.py --github-output "$GITHUB_OUTPUT"

  build_docs:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      BRAINDECODE_DOCS_JOBS: "4"
    steps:
      - name: Checking Out Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Restore multi-GB MNE and HuggingFace caches ONLY when gallery scripts execute.
      - name: Restore MNE Data Cache
        if: needs.plan.outputs.run_examples != ''
        id: cache-mne_data
        uses: actions/cache/restore@v4
        with:
          path: ~/mne_data
          key: docs-mne-data-v2-${{ hashFiles('examples/**/*.py') }}
          restore-keys: |
            docs-mne-data-v2-
            docs-mne-data-
      - name: Restore HuggingFace Cache
        if: needs.plan.outputs.run_examples != ''
        id: cache-hf
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface/hub
          key: docs-hf-hub-v2-${{ hashFiles('examples/**/*.py') }}
          restore-keys: |
            docs-hf-hub-v2-
            docs-hf-hub-

      # Restore built Sphinx-Gallery outputs on master pushes (schedule/tags run cold).
      - name: Restore Sphinx-Gallery Cache
        if: needs.plan.outputs.use_gallery_cache == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            docs/auto_examples
            docs/generated
          key: docs-sg-gallery-v1-${{ github.sha }}
          restore-keys: |
            docs-sg-gallery-v1-

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install with doc dependencies
        env:
          # CI runners have no GPU; pull the CPU-only torch wheels instead of the
          # ~1.8 GiB CUDA stack. Avoids disk exhaustion and speeds up install.
          UV_TORCH_BACKEND: cpu
          DOCS_EXTRAS: ${{ needs.plan.outputs.extras }}
        run: uv pip install --system -e ".[${DOCS_EXTRAS}]"
      - run: python -c "import braindecode; print(braindecode.__version__)"

      - name: Login to Hugging Face Hub
        if: ${{ needs.plan.outputs.run_examples != '' && env.HF_TOKEN != '' }}
        run: python -c "import os; from huggingface_hub import login; login(token=os.environ['HF_TOKEN'])"

      - name: Select the documentation URL
        # Release tags are published as /stable/ (and /X.Y/); everything else is /dev/.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "BRAINDECODE_DOCS_URL=https://braindecode.org/stable/" >> "$GITHUB_ENV"
          else
            echo "BRAINDECODE_DOCS_URL=https://braindecode.org/dev/" >> "$GITHUB_ENV"
          fi

      - name: Prepare Sphinx-Gallery Cache
        if: needs.plan.outputs.use_gallery_cache == 'true'
        run: python .github/scripts/sync_gallery_cache.py prepare --docs-dir docs --head-sha "$GITHUB_SHA"

      - name: Create Docs
        env:
          RUN_EXAMPLES: ${{ needs.plan.outputs.run_examples }}
          GALLERY_ARG: ${{ needs.plan.outputs.gallery_arg }}
          BRAINDECODE_BUILD_SITEMAP: ${{ github.event_name != 'pull_request' && '1' || '0' }}
        run: |
          echo "Gallery examples to execute: ${RUN_EXAMPLES:-none}"
          if [ -n "$RUN_EXAMPLES" ]; then
            # Configure MNE and finish shared BNCI2014_001 downloads before workers fork.
            mkdir -p ~/mne_data
            python -c "import os, mne; mne.set_config('MNE_DATA', os.path.expanduser('~/mne_data'))"
            python -c "from moabb.datasets import BNCI2014_001; BNCI2014_001().get_data([1, 2, 3])"
          fi
          cd docs
          make html SPHINXOPTS="-j auto $GALLERY_ARG"

      - name: Stamp Sphinx-Gallery Cache
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'schedule' }}
        run: python .github/scripts/sync_gallery_cache.py stamp --docs-dir docs --head-sha "$GITHUB_SHA"

      - name: Build version-scoped agent documentation
        run: |
          python -m pytest -q docs/tests/test_agent_docs.py
          # Render only the curated CRITICAL_PAGES from existing HTML doctrees.
          mapfile -t PAGES < <(python -c 'import sys; sys.path.insert(0, "docs"); from build_agent_docs import CRITICAL_PAGES; print("\n".join(f"docs/{p}.rst" for p in CRITICAL_PAGES))')
          sphinx-build -j auto -b markdown -d docs/_build/doctrees -D plot_gallery=0 docs docs/_build/markdown "${PAGES[@]}"
          python docs/build_agent_docs.py \
            --markdown-root docs/_build/markdown \
            --html-root docs/_build/html \
            --site-url "$BRAINDECODE_DOCS_URL" \
            --version "$(python -c 'import braindecode; print(braindecode.__version__)')" \
            --revision "$(git rev-parse HEAD)"

      - name: Preserve previously published notebook URLs
        run: |
          mkdir -p docs/_build/html/auto_examples/_notebooks
          rsync -am --include='*/' --include='*.ipynb' --exclude='*' \
            docs/auto_examples/ docs/_build/html/auto_examples/_notebooks/

      - name: Save MNE Data Cache
        if: ${{ github.event_name != 'pull_request' && needs.plan.outputs.run_examples != '' && steps.cache-mne_data.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/mne_data
          key: ${{ steps.cache-mne_data.outputs.cache-primary-key }}

      - name: Save HuggingFace Cache
        if: ${{ github.event_name != 'pull_request' && needs.plan.outputs.run_examples != '' && steps.cache-hf.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ steps.cache-hf.outputs.cache-primary-key }}

      - name: Save Sphinx-Gallery Cache
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'schedule' }}
        uses: actions/cache/save@v4
        with:
          path: |
            docs/auto_examples
            docs/generated
          key: docs-sg-gallery-v1-${{ github.sha }}

      - name: Upload HTML Docs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Docs
          path: ./docs/_build/html

      - name: Deploy to Github Pages if on Master
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: braindecode/braindecode.github.io
          destination_dir: dev
          publish_branch: master
          publish_dir: ./docs/_build/html
          cname: braindecode.org
