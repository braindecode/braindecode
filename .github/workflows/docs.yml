name: docs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true
# Pull requests execute only the gallery examples they change (none: no
# execution). Master pushes, tags, release/* branches, the weekly schedule and
# manual runs execute the full gallery.
on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  pull_request:
    branches:
      - '*' # all branches, including forks
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  build_docs:
    runs-on: ubuntu-latest
    env:
      # `sae` (SAE Lens) lets the optional SAE tutorials execute. It is a
      # docs-build install only: not a core dependency and not in `all`.
      DOCS_EXTRAS: docs,moabb,hub,eegprep,typing,viz,sae
      HF_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
    steps:
      ## Install Braindecode
      - name: Checking Out Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # the PR merge commit and its base, to list changed examples
      # Install python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Cache MNE Data and HuggingFace Hub weights.
      # Both caches are content-addressed (filenames + checksums for MNE,
      # commit-pinned safetensors for HF), so they only need to rotate when the
      # set of examples/docs inputs changes. That preserves reuse across normal
      # CI runs instead of forcing a brand-new multi-GB cache upload every time.
      # Only non-PR runs save them: per-PR copies (2-4 GB each) filled the 10 GB
      # repository quota and evicted master's, so every run started cold.
      - name: Restore MNE Data Cache
        id: cache-mne_data
        uses: actions/cache/restore@v4
        with:
          path: ~/mne_data
          key: docs-mne-data-v2-${{ hashFiles('examples/**/*.py', 'docs/**/*.rst', 'docs/**/*.py', 'docs/conf.py') }}
          restore-keys: |
            docs-mne-data-v2-
            docs-mne-data-
      - name: Restore HuggingFace Cache
        id: cache-hf
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface/hub
          key: docs-hf-hub-v2-${{ hashFiles('examples/**/*.py', 'docs/**/*.rst', 'docs/**/*.py', 'docs/conf.py') }}
          restore-keys: |
            docs-hf-hub-v2-
            docs-hf-hub-
      # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      # Install with all dependencies for doc build to go through
      - name: Install with doc dependencies
        env:
          # CI runners have no GPU; pull the CPU-only torch wheels instead of the
          # ~1.8 GiB CUDA stack. Avoids disk exhaustion and speeds up install.
          UV_TORCH_BACKEND: cpu
        run: uv pip install --system -e ".[${{ env.DOCS_EXTRAS }}]"
      # Show Braindecode Version
      - run: python -c "import braindecode; print(braindecode.__version__)"
      # Persist HF token to disk so sphinx-gallery examples can access gated repos
      - name: Login to Hugging Face Hub
        if: ${{ env.HF_TOKEN != '' }}
        run: python -c "import os; from huggingface_hub import login; login(token=os.environ['HF_TOKEN'])"
      - name: Select the documentation URL
        # Release tags are published as /stable/ (and /X.Y/); everything else is /dev/.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "BRAINDECODE_DOCS_URL=https://braindecode.org/stable/" >> "$GITHUB_ENV"
          else
            echo "BRAINDECODE_DOCS_URL=https://braindecode.org/dev/" >> "$GITHUB_ENV"
          fi

      - name: Create Docs
        env:
          # DANCE alone peaks near 8.5 GB; do not use auto gallery workers.
          BRAINDECODE_DOCS_JOBS: "2"
          PARTIAL: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/') }}
        run: |
          # Configure MNE before workers can race on first-use config creation.
          mkdir -p ~/mne_data
          python -c "import os, mne; mne.set_config('MNE_DATA', os.path.expanduser('~/mne_data'))"
          RUN=all GALLERY=""
          if [ "$PARTIAL" = true ]; then
            RUN=$(git diff --name-only --diff-filter=d HEAD^1 HEAD -- examples | sed -n 's|.*/\(plot_[^/]*\)\.py$|\1|p' | paste -sd'|' -)
            GALLERY="-D 'sphinx_gallery_conf.filename_pattern=/($RUN)\.py'"
            if [ -z "$RUN" ]; then GALLERY="-D plot_gallery=0"; fi
          fi
          echo "Gallery examples to execute: ${RUN:-none}"
          if [ -n "$RUN" ]; then
            # Gallery workers can import MOABB examples concurrently; finish NEMAR downloads and legacy-file materialization first.
            python -c "from moabb.datasets import BNCI2014_001; BNCI2014_001().get_data([1, 2, 3])"
          fi
          cd docs
          # memory_profiler cannot start its monitor inside a loky worker.
          # The full pass reuses this example's same-build gallery result.
          if [[ "$RUN" == all || "$RUN" == *plot_benchmark_preprocessing* ]]; then
            BRAINDECODE_DOCS_JOBS=1 make html SPHINXOPTS="-j auto -D sphinx_gallery_conf.filename_pattern=plot_benchmark_preprocessing.py"
          fi
          make html SPHINXOPTS="-j auto $GALLERY"

      - name: Build version-scoped agent documentation
        run: |
          python -m pytest -q docs/tests/test_agent_docs.py
          # Reuse the completed HTML doctrees; never re-run gallery examples.
          sphinx-build -b markdown -d docs/_build/doctrees -D plot_gallery=0 docs docs/_build/markdown
          python docs/build_agent_docs.py \
            --markdown-root docs/_build/markdown \
            --html-root docs/_build/html \
            --site-url "$BRAINDECODE_DOCS_URL" \
            --version "$(python -c 'import braindecode; print(braindecode.__version__)')" \
            --revision "$(git rev-parse HEAD)"

      - name: Preserve previously published notebook URLs
        run: |
          mkdir -p docs/_build/html/auto_examples/_notebooks
          rsync -am --include='*/' --include='*.ipynb' --exclude='*' \
            docs/auto_examples/ docs/_build/html/auto_examples/_notebooks/

      - name: Save MNE Data Cache
        if: ${{ github.event_name != 'pull_request' && steps.cache-mne_data.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/mne_data
          key: ${{ steps.cache-mne_data.outputs.cache-primary-key }}

      - name: Save HuggingFace Cache
        if: ${{ github.event_name != 'pull_request' && steps.cache-hf.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ steps.cache-hf.outputs.cache-primary-key }}

      - name: Upload HTML Docs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Docs
          path: ./docs/_build/

      - name: Deploy to Github Pages if on Master
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: braindecode/braindecode.github.io
          destination_dir: dev
          publish_branch: master
          publish_dir: ./docs/_build/html
          cname: braindecode.org

      - name: Deploy /stable/, /X.Y/, and root discovery files on release tag
        id: tag_deploy
        if: ${{ github.repository == 'braindecode/braindecode' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          DEPLOY_KEY: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+)(\.[0-9]+)?$ ]]; then
            echo "Skipping stable docs deploy for non-final release tag: $GITHUB_REF_NAME"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          XY="${BASH_REMATCH[1]}"
          if [[ -z "$DEPLOY_KEY" ]]; then
            echo "::error::ACTIONS_DEPLOY_KEY secret is required to deploy release docs"
            exit 1
          fi

          install -d -m 700 ~/.ssh
          KEY_FILE="$(mktemp ~/.ssh/deploy_key.XXXXXX)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null

          export GIT_SSH_COMMAND="ssh -i ${KEY_FILE} -o IdentitiesOnly=yes"
          rm -rf /tmp/gh-pages
          git clone --depth 1 --branch master \
            git@github.com:braindecode/braindecode.github.io.git /tmp/gh-pages

          rm -rf /tmp/gh-pages/stable "/tmp/gh-pages/${XY}"
          cp -a ./docs/_build/html /tmp/gh-pages/stable
          cp -a ./docs/_build/html "/tmp/gh-pages/${XY}"

          cp ./docs/_root/robots.txt /tmp/gh-pages/robots.txt
          cp ./docs/_root/sitemap.xml /tmp/gh-pages/sitemap.xml
          cp ./docs/_root/index.html /tmp/gh-pages/index.html
          cp ./docs/_build/html/llms.txt /tmp/gh-pages/llms.txt
          printf 'braindecode.org\n' > /tmp/gh-pages/CNAME
          touch /tmp/gh-pages/.nojekyll

          CLEAN_KEY="${INDEXNOW_KEY//[[:space:]]/}"
          if [[ -n "$CLEAN_KEY" ]]; then
            if [[ ! "$CLEAN_KEY" =~ ^[A-Za-z0-9-]{8,128}$ ]]; then
              echo "::error::INDEXNOW_KEY contains invalid characters"
              exit 1
            fi
            printf '%s' "$CLEAN_KEY" > "/tmp/gh-pages/${CLEAN_KEY}.txt"
          fi

          cd /tmp/gh-pages
          git add -A
          {
            git diff --cached --name-only -- stable/ \
              | grep -E '^stable/.*\.(html|md)$|^stable/(llms\.txt|sitemap\.xml)$' \
              | sed 's|^|https://braindecode.org/|' || true
            echo "https://braindecode.org/"
            echo "https://braindecode.org/sitemap.xml"
            echo "https://braindecode.org/llms.txt"
            echo "https://braindecode.org/stable/index.html"
            echo "https://braindecode.org/stable/sitemap.xml"
          } | sort -u > /tmp/indexnow_urls.txt

          if git diff --cached --quiet; then
            echo "No documentation changes to publish for $GITHUB_REF_NAME"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "deploy(stable): ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
            git pull --rebase origin master
            git push origin master
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify IndexNow (Bing, ChatGPT Search, Copilot, Yandex, Naver, Seznam)
        if: ${{ steps.tag_deploy.outputs.pushed == 'true' && env.INDEXNOW_PRESENT == 'true' }}
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_PRESENT: ${{ secrets.INDEXNOW_KEY != '' }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = "".join(os.environ["INDEXNOW_KEY"].split())
          with open("/tmp/indexnow_urls.txt", encoding="utf-8") as fh:
              urls = [line.strip() for line in fh if line.strip()][:10000]
          if not urls:
              raise SystemExit(0)

          payload = {
              "host": "braindecode.org",
              "key": key,
              "keyLocation": f"https://braindecode.org/{key}.txt",
              "urlList": urls,
          }
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  print(f"IndexNow submitted {len(urls)} URLs -> HTTP {resp.status}")
                  if resp.status not in (200, 202):
                      raise RuntimeError(f"Unexpected IndexNow HTTP {resp.status}")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise RuntimeError(
                  f"IndexNow POST failed with HTTP {exc.code}: {body}"
              ) from exc
          PY
