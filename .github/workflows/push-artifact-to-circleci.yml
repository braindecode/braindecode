name: push-artifact-to-circle-ci
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["docs"]
    branches-ignore: ["master"]
    types:
      - completed

jobs:
  Push-Artifact-to-CircleCI:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CircleCI download and publication of HTML Doc Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          # Skip cleanly when the docs planner skipped `build_docs` (no HTML-Docs artifact).
          ARTIFACT_COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "HTML-Docs")] | length')
          if [[ "${ARTIFACT_COUNT:-0}" -eq 0 ]]; then
            echo "Run ${RUN_ID} produced no HTML-Docs artifact; skipping CircleCI preview."
            exit 0
          fi

          PR_NUMBER=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          if [[ -z "$PR_NUMBER" ]]; then
            PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/pulls" --jq '.[0].number // empty')
          fi
          if [[ -z "$PR_NUMBER" ]]; then
            echo "Could not resolve pull request number for commit ${COMMIT_SHA}; skipping."
            exit 0
          fi
          echo "Publishing HTML-Docs from run ${RUN_ID} for PR #${PR_NUMBER}"

          PAYLOAD=$(jq -n \
            --arg branch "pull/${PR_NUMBER}/head" \
            --arg url "https://nightly.link/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/HTML-Docs.zip" \
            '{branch: $branch, parameters: {"github-artifact-url": $url}}')

          curl --fail --silent --show-error --request POST \
            --url "https://circleci.com/api/v2/project/gh/${GITHUB_REPOSITORY}/pipeline" \
            --header "Circle-Token: $CIRCLECI_TOKEN" \
            --header "content-type: application/json" \
            --header "x-attribution-actor-id: github_actions" \
            --header "x-attribution-login: github_actions" \
            --data "$PAYLOAD"
