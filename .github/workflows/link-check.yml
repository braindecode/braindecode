name: Link Check
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main, master]
    paths:
      - "**.md"
      - "docs/**"
      - "!docs/whats_new.rst"
      - ".github/workflows/link-check.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "**.md"
      - "docs/**"
      - "!docs/whats_new.rst"
      - ".github/workflows/link-check.yml"
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select target files
        id: targets
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]] && ! git diff --name-only HEAD^1 HEAD | grep -qx '\.github/workflows/link-check\.yml'; then
            mapfile -t FILES < <(git diff --name-only --diff-filter=d HEAD^1 HEAD -- '*.md' '*.rst')
            if [[ ${#FILES[@]} -eq 0 ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf '%s\n' "${FILES[@]}" > .lychee-targets.txt
            echo "mode=changed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=all" >> "$GITHUB_OUTPUT"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # https://github.com/qinxwew: a past contributor's GitHub account no longer
      # exists (404, and their pull requests are hidden). The changelog keeps the
      # attribution and its link target unchanged, so the link is excluded here.
      - name: Check links in Markdown and RST files
        if: steps.targets.outputs.skip != 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,206,301,302,303,307,308,429
            --timeout 30
            --max-retries 3
            --exclude "^mailto:"
            --exclude "^https://github\\.com/braindecode/braindecode/(issues|pulls|compare)"
            --exclude "^https://github\\.com/.*/(fork|new)"
            --exclude "localhost"
            --exclude "127\\.0\\.0\\.1"
            --exclude "example\\.com"
            --exclude "^file://"
            --exclude "^git\\+"
            --exclude "arxiv\\.org"
            --exclude "twitter\\.com"
            --exclude "x\\.com"
            --exclude "linkedin\\.com"
            --exclude "app\\.gitter\\.im"
            --exclude "gitter\\.im"
            --exclude "gitlab\\.com"
            --exclude "dx\\.doi\\.org"
            --exclude "^https://doi\\.org/10\\.1002/hbm"
            --exclude "^https://dl\\.acm\\.org/doi"
            --exclude "^https://github\\.com/qinxwew$"
            ${{ steps.targets.outputs.mode == 'changed' && '$(tr "\n" " " < .lychee-targets.txt)' || '"./**/*.md" "./**/*.rst"' }}
          fail: true
          output: ./lychee-report.md

      - name: Upload link check report
        uses: actions/upload-artifact@v4
        if: always() && steps.targets.outputs.skip != 'true'
        with:
          name: link-check-report
          path: ./lychee-report.md
          retention-days: 30

      - name: Create issue on link check failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('./lychee-report.md', 'utf8');
            } catch (e) {
              report = 'Could not read the link check report.';
            }
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-links'
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Broken links detected in documentation',
                body: `## Automated Link Check Report\n\nThe weekly link check has detected broken links.\n\n<details>\n<summary>Report</summary>\n\n${report}\n\n</details>`,
                labels: ['broken-links', 'documentation']
              });
            }
