name: tests
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true
env:
  TEST_EXTRAS: tests,moabb,hub,eegprep,typing,viz
on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - '*' # all branches, including forks

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      # torch/OpenMP/MKL threads x xdist workers (-n auto) = vCPUs: macOS 3 x 1,
      # Linux/Windows 2 x 2. Unpinned, each worker used every core; 4 workers x 1
      # thread stopped both 16 GB Linux runners mid-suite.
      OMP_NUM_THREADS: ${{ matrix.os == 'macos-latest' && '1' || '2' }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            run-coverage: true
    steps:
    ## Install Braindecode
    - name: Checking Out Repository
      uses: actions/checkout@v4
    # Cache MNE Data
    # The cache key separates MNE data by runner OS and Python version.
    - name: Create/Restore MNE Data Cache
      id: cache-mne_data
      uses: actions/cache@v4
      with:
        path: ~/mne_data
        key: test-2-${{ runner.os }}-${{ matrix.python-version }}
        restore-keys: |
          test-2-${{ runner.os }}-${{ matrix.python-version }}-
          test-2-${{ runner.os }}-
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: latest
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"

    - name: Show Python Version
      run: python --version
    - name: Install Braindecode from Current Checkout
      env:
        # CI runners have no GPU; pull the CPU-only torch wheels instead of the
        # ~1.8 GiB CUDA stack. Avoids disk exhaustion and speeds up install.
        UV_TORCH_BACKEND: cpu
      run: uv pip install --system -e ".[${{ env.TEST_EXTRAS }}]"
    # Show Braindecode Version
    - run: python -c "import braindecode; print(braindecode.__version__)"

    # xdist collects modules concurrently; finish NEMAR downloads and legacy-file materialization first.
    - name: Materialize MOABB test data before xdist
      run: python -c "from moabb.datasets import BNCI2014_001; BNCI2014_001().get_data([1, 2, 4])"

    - name: Compute TorchInductor Cache Key
      id: compiler-cache-key
      if: ${{ matrix.run-coverage }}
      shell: bash
      run: |
        deps_hash="$(uv pip freeze --system | sha256sum | cut -d' ' -f1)"
        torch_hash="$(python - <<'PY' | sha256sum | cut -d' ' -f1
        import platform
        import sys
        import torch

        print(sys.version)
        print(platform.machine())
        print(torch.__version__)
        print(torch.version.git_version)
        print(torch.backends.cpu.get_cpu_capability())
        print(torch.__config__.show())
        PY
        )"
        compiler_hash="$(c++ --version | sha256sum | cut -d' ' -f1)"
        image="${ImageOS:-unknown}-${ImageVersion:-unknown}"
        prefix="torchinductor-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-${image}-${deps_hash}-${torch_hash}-${compiler_hash}"
        source_hash="${{ hashFiles('pyproject.toml', 'uv.lock', 'braindecode/**/*.py', 'test/unit_tests/models/test_integration.py', '.github/workflows/tests.yml') }}"
        echo "key=${prefix}-${source_hash}" >> "$GITHUB_OUTPUT"
        echo "restore-prefix=${prefix}-" >> "$GITHUB_OUTPUT"

    - name: Restore TorchInductor Cache
      id: restore-compiler-cache
      if: ${{ matrix.run-coverage && github.event_name == 'pull_request' }}
      uses: actions/cache/restore@v4
      # Master intentionally runs cold, then seeds this cache for pull requests.
      with:
        path: ${{ runner.temp }}/torchinductor
        key: ${{ steps.compiler-cache-key.outputs.key }}
        restore-keys: ${{ steps.compiler-cache-key.outputs.restore-prefix }}

    ## Run Tests
    - name: Run Full Test Suite with Coverage # See https://stackoverflow.com/a/59959080/1469195 for the cov-report logic
      if: ${{ matrix.run-coverage }}
      env:
        HF_TOKEN_REVE: ${{ secrets.HF_TOKEN_REVE }}
        TORCHINDUCTOR_CACHE_DIR: ${{ runner.temp }}/torchinductor
        TORCHINDUCTOR_FX_GRAPH_CACHE: "1"
      # Redistribute individual tests: the integration module dominates runtime.
      run: pytest -vv --durations=0 -n auto --dist worksteal --cov=braindecode test/ --cov-report term --cov-report xml:coverage.xml

    - name: Run Full Test Suite
      if: ${{ !matrix.run-coverage }}
      env:
        HF_TOKEN_REVE: ${{ secrets.HF_TOKEN_REVE }}
      # test_model_compiled runs only in the coverage job above, which restores
      # the TorchInductor cache; elsewhere it recompiled every model cold.
      run: pytest -vv --durations=0 -n auto --dist worksteal test/ -k "not test_model_compiled"

    - name: Save TorchInductor Cache
      if: ${{ matrix.run-coverage && success() && steps.restore-compiler-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/torchinductor
        key: ${{ steps.compiler-cache-key.outputs.key }}

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      continue-on-error: true
      if: ${{ matrix.run-coverage }}
      with:
        file: ./coverage.xml
        env_vars: OS,PYTHON
        token: ${{ secrets.CODECOV_TOKEN }}

  # Real-data acceptance tests (marked network, so skipped by the jobs above).
  # They train on BNCI2014_001 subject 1, which the ubuntu test jobs download too.
  acceptance:
    name: acceptance (ubuntu-latest, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
    steps:
    - name: Checking Out Repository
      uses: actions/checkout@v4
    # Restore-only: reuse the ubuntu test job's MNE data without saving a
    # smaller cache under its key.
    - name: Restore MNE Data Cache
      uses: actions/cache/restore@v4
      with:
        path: ~/mne_data
        key: test-2-${{ runner.os }}-${{ matrix.python-version }}
        restore-keys: |
          test-2-${{ runner.os }}-${{ matrix.python-version }}-
          test-2-${{ runner.os }}-
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: latest
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"
    - name: Install Braindecode from Current Checkout
      env:
        UV_TORCH_BACKEND: cpu
      run: uv pip install --system -e ".[${{ env.TEST_EXTRAS }}]"
    - name: Show Library Versions
      run: python -c "import braindecode, moabb, mne, numpy, torch; print(braindecode.__version__, moabb.__version__, mne.__version__, numpy.__version__, torch.__version__)"
    - name: Materialize acceptance test data
      run: python -c "from moabb.datasets import BNCI2014_001; BNCI2014_001().get_data([1])"
    - name: Run Acceptance Tests
      run: pytest test/acceptance_tests --run-network -n 0 -vv -rP --durations=0
