name: Build and check the distributions
description: Build a wheel from the sdist and test its installation outside the checkout
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml
    - name: Build sdist and wheel
      shell: bash
      run: |
        python -m pip install build twine
        python -m build
        python -m twine check --strict dist/*
    - name: Exercise the installed wheel
      shell: python
      env:
        UV_TORCH_BACKEND: cpu
        HF_HUB_OFFLINE: "1"
        OMP_NUM_THREADS: "1"
      run: |
        import os
        import subprocess
        import sys
        from pathlib import Path

        wheel, = Path("dist").glob("*.whl")
        smoke = Path(os.environ["GITHUB_WORKSPACE"]) / "scripts" / "check_wheel.py"
        subprocess.run(
            [
                "uv", "run", "--no-project", "--isolated", "--python", sys.executable,
                "--with", f"braindecode[hub] @ {wheel.resolve().as_uri()}",
                "python", "-I", str(smoke),
            ],
            cwd=os.environ["RUNNER_TEMP"],
            check=True,
        )
