name: Build and check the distributions
description: Build a wheel from the sdist and test its installation outside the checkout
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml
    - name: Build sdist and wheel
      shell: bash
      run: |
        python -m pip install build twine
        python -m build
        python -m twine check --strict dist/*
    - name: Exercise the installed wheel
      shell: bash
      env:
        UV_TORCH_BACKEND: cpu
        HF_HUB_OFFLINE: "1"
        OMP_NUM_THREADS: "1"
      run: |
        wheels=("$PWD"/dist/*.whl)
        test "${#wheels[@]}" -eq 1
        interpreter="$(python -c 'import sys; print(sys.executable)')"
        cd "$RUNNER_TEMP"
        uv run --no-project --isolated --python "$interpreter" --with "${wheels[0]}[hub]" \
          python -I "$GITHUB_WORKSPACE/scripts/check_wheel.py"
