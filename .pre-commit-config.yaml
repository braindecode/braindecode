default_language_version:
  python: python3

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks
  autofix_prs: true
  autoupdate_branch: "master"
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: quarterly
  skip: [ ]
  submodules: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-executables-have-shebangs
      - id: check-toml
      - id: check-docstring-first
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: forbid-new-submodules
      - id: pretty-format-json
        args: [ "--autofix", "--no-sort-keys", "--indent=4" ]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=Gool,carin,splitted,meaned,wil,whats,additionals,alle,alot,bund,currenty,datas,farenheit,falsy,fo,haa,hass,iif,incomfort,ines,ist,nam,nd,pres,pullrequests,resset,rime,ser,serie,te,technik,ue,unsecure,withing,zar,mane,THIRDPARTY,Hsi,Buss,Claus,Lew,Shepard,Comon,temparature,Mian,OVERRIDEABLE
          - --skip="./.*,*.csv,*.json,*.ambr,*.toml"
          - --quiet-level=2
        exclude_types: [ csv, json ]
        exclude: ^tests/|generated/^.github

  - repo: https://github.com/asottile/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs
        exclude: ^.github|CONTRIBUTING.md

  # -----------------------------
  # Sphinx/RST formatting + lint
  # -----------------------------

  - repo: https://github.com/LilSpazJoekp/docstrfmt
    rev: v2.0.0
    hooks:
      - id: docstrfmt
        name: docstrfmt (rst only; do not touch numpy docstrings)
        language_version: python3
        files: \.(rst|txt)$
        exclude: ^docs/_templates/|^docs/whats_new\.rst$|^docs/_root/

  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: v1.0.2
    hooks:
      - id: sphinx-lint
        name: sphinx-lint (rst)
        types: [rst]

  # Optional: run the real Sphinx warning engine, but keep it off the default commit path.
  - repo: local
    hooks:
      - id: sphinx-build-warnings
        name: sphinx-build -n -W --keep-going (manual)
        entry: sphinx-build -b html -n -W --keep-going docs docs/_build/html
        language: system
        pass_filenames: false
        stages: [manual]

      - id: numpydoc-validate
        name: numpydoc lint (manual)
        entry: python -m numpydoc lint
        language: system
        types: [python]
        files: ^braindecode/
        stages: [manual]

      - id: ty
        name: ty check
        entry: ty check
        language: python
        types_or: [python, pyi, toml]
        pass_filenames: false
        require_serial: true
        additional_dependencies: ["ty==0.0.107"]
