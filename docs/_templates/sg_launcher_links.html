{% set notebook = get_download_links().get('jupyter') %}
{% if notebook %}
{% set doc_version = doc_version|default('dev') %}

<div class="sd-card sd-shadow-sm sd-mb-3">
  <div class="sd-card-body" style="display:flex; flex-direction:column; align-items:center; text-align:center;">
    <p class="sd-card-text sd-fs-5 sd-font-weight-bold sd-mb-2" style="margin-bottom:0.75rem;">Run this example</p>

    <a class="sd-btn sd-btn-primary" style="display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:0.25rem; padding:0.5rem 0.75rem;" href="https://colab.research.google.com/github/braindecode/braindecode.github.io/blob/master/{{ doc_version }}/{{ notebook.link }}" target="_blank" rel="noopener">
      <img alt="Open in Colab" src="https://colab.research.google.com/assets/colab-badge.svg" style="vertical-align: middle; height: 20px;">
    </a>

  </div>
</div>
{% endif %}
