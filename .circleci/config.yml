version: 2.1
parameters:
  github-artifact-url:
    type: string
    default: "none"

jobs:
  fetch_docs_from_github:
    docker:
      - image: cimg/base:current
    environment:
      GITHUB_ARTIFACT_URL: << pipeline.parameters.github-artifact-url >>
    steps:
      - run:
          name: Download HTML docs artifact
          command: |
            echo "Downloading artifact from: $GITHUB_ARTIFACT_URL"
            wget -q -O HTML-docs.zip "$GITHUB_ARTIFACT_URL"
            unzip -q HTML-docs.zip -d downloaded_docs
            if [ -d downloaded_docs/html ] && [ ! -f downloaded_docs/index.html ]; then
              mv downloaded_docs/html downloaded_docs_html
              rm -rf downloaded_docs
              mv downloaded_docs_html downloaded_docs
            fi
            ls -ahl downloaded_docs
      - store_artifacts:
          path: downloaded_docs
          destination: dev

workflows:
  version: 2.1
  default:
    when:
      not:
        equal: [ "none", << pipeline.parameters.github-artifact-url >> ]
    jobs:
      - fetch_docs_from_github
