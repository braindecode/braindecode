[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "braindecode"
dynamic = ["version"]
description = "Deep learning software to decode EEG, ECG or MEG signals"
authors = [
    { name = "Robin Tibor Schirrmeister", email = "robintibor@gmail.com" },
    { name = "Bruno Aristimunha Pinto", email = "b.aristimunha@gmail.com" },
    { name = "Alexandre Gramfort", email = "agramfort@meta.com" },
]
maintainers = [
    { name = "Alexandre Gramfort", email = "agramfort@meta.com" },
    { name = "Bruno Aristimunha Pinto", email = "b.aristimunha@gmail.com" },
    { name = "Robin Tibor Schirrmeister", email = "robintibor@gmail.com" },
]
license = { text = "BSD-3-Clause" }
keywords = [
    "python",
    "deep-learning",
    "neuroscience",
    "pytorch",
    "meg",
    "eeg",
    "neuroimaging",
    "electroencephalography",
    "magnetoencephalography",
    "electrocorticography",
    "ecog",
    "electroencephalogram",
]
classifiers = [
    'Development Status :: 3 - Alpha',
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    'Topic :: Software Development :: Build Tools',
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
readme = "README.rst"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "torchaudio>=2.6",
    'mne>=1.13.0',  # we get matplotlib, numpy, scipy from here
    'mne_bids>=0.19', # in theory we get the mne here, but we prefer to have it explicit
    'h5py',
    'skorch>=1.3.1',
    'joblib',
    'torchinfo',
    'jinja2',  # autoescaped notebook representations, as in MNE
    'pandas',
    'wfdb>=4.3.1',  # requests comes transitively via mne→pooch and wfdb
    'docstring_inheritance',
    'einops',
    'pydantic>=2.11.4',
]

[tool.uv]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",   # Apple Silicon Mac (M1/M2/M3)
  "sys_platform == 'linux' and platform_machine == 'x86_64'",   # Linux 64-bit
  "sys_platform == 'win32' and platform_machine == 'AMD64'"     # Windows 64-bit
]

[project.urls]
homepage = "https://braindecode.org"
repository = "https://github.com/braindecode/braindecode"
documentation = "https://braindecode.org/stable/index.html"

[project.optional-dependencies]
moabb = ["moabb>=1.4.3"]
eegprep = [
    "eegprep[eeglabio]>=0.2.23",
    # eegprep for Python 3.11 (<= 0.3.0) needs sympy>=1.14, which torch 2.6 rules
    # out (it pins sympy==1.13.1); eegprep 0.4.0 drops sympy but needs Python 3.12.
    'torch>=2.7; python_version < "3.12"',
]
hub = ["huggingface_hub[torch]>=0.22.0", "zarr>=3.1"]
viz = ["captum>=0.7.0"]
sae = ["sae-lens==6.51.3"]  # Optional gallery only; not part of core or all.
tests = [
    'pytest<9.1',  # pytest 9.1.0 changed IdMaker's signature, which breaks pytest_cases 3.10.1 (crash at collection time). Remove the cap once pytest_cases supports pytest >=9.1.
    'pytest-cov',
    'pytest-xdist>=3.8.0',
    'pytest-timeout',
    'codecov',
    'pytest_cases',
    'ty>=0.0.107',
    'ipython',
    "transformers>=4.57.0",
    "bids_validator",
    "timescoring==0.0.7",  # oracle for szcore_event_scores; pinned because SzCORE results changed between releases
]
typing = [
    'exca>=0.5.10',
    'numpydantic>=1.7',
]

docs = [
    'pytest<9.1',  # Offline agent documentation contract tests; match the test extra.
    'sphinx-markdown-builder==0.6.11',
    'sphinx_gallery>=0.17',
    'sphinx-autodoc-typehints',
    'sphinx-autobuild',
    'sphinxcontrib-bibtex',
    'sphinx_sitemap',
    'sphinxext-opengraph',
    'pydata_sphinx_theme',
    'numpydoc',
    'pillow',
    'ipython',
    'sphinx_design',
]

docs-gallery = [
    'lightning',
    'openneuro-py>=2026.4.0',  # 2026.4.0 fixes DatasetFile.key->id after the OpenNeuro 5.0.0 schema change; older versions break against the live GraphQL server
    'seaborn',
    'shap',
]

all = [
    "braindecode[moabb]",
    "braindecode[tests]",
    "braindecode[docs]",
    "braindecode[docs-gallery]",
    "braindecode[hub]",
    "braindecode[eegprep]",
    "braindecode[typing]",
    "braindecode[viz]",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.dynamic]
version = { attr = "braindecode.version.__version__" }

[tool.setuptools.packages.find]
where = ["."] # list of folders that contain the packages (["."] by default)
include = [
    "braindecode*",
] # package names should match these glob patterns (["*"] by default)
exclude = [] # exclude packages matching these glob patterns (empty by default)
namespaces = false # to disable scanning PEP 420 namespaces (true by default)

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
exclude = ["test/**", ".github/**", "scripts/**", "benchmarks/**", "CONTRIBUTING.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "NPY201"]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D105",
    "D107",
    "D203",
    "D205",
    "D213",
    "D400",
    "D415",
    "D417",
    "E402",
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["braindecode"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"!{docs,examples}/**" = ["D", "E712", "E741", "F541", "F841"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["braindecode", "test", "examples"]

[tool.ty.terminal]
error-on-warning = false
output-format = "concise"

[tool.ty.rules]
# Promote dynamic/erased base classes (e.g. `: Type` on mixins/decorators) to hard errors.
unsupported-base = "error"

# Optional extras (moabb, sae_lens, timescoring), hardware SDKs (flash_attn,
# habana_frameworks), and isolated pre-commit environments without torch/mne installed.
import-not-found = "ignore"

# Legacy gradual-typing noise from PyTorch Module.__getattr__ -> Tensor | Module
# (register_buffer / dynamic submodules), MNE dynamic FIFF BunchConstNamed constants,
# optional EEGModuleMixin geometry attributes, and NumPy ArrayLike / pytest parametrize unions.
invalid-argument-type = "ignore"
not-callable = "ignore"
missing-union-attribute = "ignore"
not-subscriptable = "ignore"
missing-attribute = "ignore"
lost-keyword-for-regular-parameter = "ignore"  # PyTorch `def forward(self, x)` vs `input`
unused-type-ignore-comment = "ignore"  # Retain existing `# type: ignore` directives
unused-ignore-comment = "ignore"  # Allow `# ty: ignore` on optional-dep imports in isolated CI

# Low-volume legacy typing debt kept visible as non-blocking warnings for incremental cleanup.
unsupported-operator = "warn"
no-matching-overload = "warn"
invalid-assignment = "warn"
not-iterable = "warn"
incompatible-method-override = "warn"
invalid-explicit-return = "warn"
incompatible-attribute-override = "warn"

[[tool.ty.overrides]]
include = ["test/**"]

[tool.ty.overrides.rules]
# Heterogeneous model-registry dicts in test_pretrained_compat.py and __torch_dispatch__ tuple unpacking.
unknown-argument = "warn"
index-out-of-bounds = "warn"

[tool.coverage.run]
core = "sysmon"

[tool.pytest.ini_options]
testpaths = ["test"]
# which files count as test modules
python_files = ["test_*.py", "*_test.py"]
# which functions inside them count as tests
python_functions = ["test_*"]
# delete each passing test's tmp_path: the save/load round-trips write GBs of
# weights, which filled the Windows runner disk
tmp_path_retention_policy = "failed"
# No test takes more than a few minutes; a worker that stops answering (a
# native crash in a kernel leaves xdist waiting for it, which held CI jobs
# for hours) fails its test with a traceback instead.
timeout = 600
timeout_method = "thread"
markers = [
    "integration: integration tests",
    "network: tests that require network access",
    "huggingface: tests that access Hugging Face Hub",
    "slow: slow tests",
]
